<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Harshavardhan Reddy Narra</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #0a0a13;
        color: #fff;
        font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        background-image:
          radial-gradient(at 15% 0%, rgba(139, 92, 246, 0.20) 0px, transparent 45%),
          radial-gradient(at 85% 12%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
          radial-gradient(at 50% 100%, rgba(34, 211, 238, 0.10) 0px, transparent 55%);
      }
      .card {
        max-width: 520px;
        padding: 40px;
        border: 1px solid rgba(139, 92, 246, 0.18);
        border-radius: 24px;
        background: rgba(19, 19, 42, 0.55);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        text-align: center;
      }
      .kicker {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(167, 139, 250, 0.95);
      }
      h1 {
        margin: 8px 0 0;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-weight: 700;
        font-size: 64px;
        background-image: linear-gradient(90deg, #a78bfa, #818cf8, #67e8f9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { color: rgba(255, 255, 255, 0.75); line-height: 1.6; margin-top: 16px; }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
        padding: 12px 20px;
        border-radius: 12px;
        background: linear-gradient(90deg, #8b5cf6, #6366f1);
        color: white;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 10px 30px rgba(139, 92, 246, 0.35);
      }
      a.btn:hover { filter: brightness(1.1); }
      code {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 12px;
        color: rgba(167, 139, 250, 0.95);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="kicker">404 — page not found</div>
      <h1>Stalled pipeline.</h1>
      <p>
        The address you tried doesn't match any section on this site —
        looks like a <code>NOP</code> in this stage. Head back to the home
        page and pick a section from the navigation.
      </p>
      <a class="btn" href="/">Back to portfolio</a>
    </div>
  </body>
</html>
